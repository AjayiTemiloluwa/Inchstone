name: Opportunity Scout

# Hourly ping: sends each user's opportunity digest at the hour they chose (in
# their timezone) and runs everyone's daily scout. The endpoint stamps every
# run, so extra or late pings never double-send.
# NOTE: GitHub auto-disables repo schedules after 60 days without any commits.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: opportunity-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/cron/scout
        shell: bash
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="${SITE_URL:-https://myinchstone.vercel.app}"
          if [ -n "$CRON_SECRET" ]; then
            curl --fail-with-body -sS --max-time 70 -w " (HTTP %{http_code})\n" -H "x-cron-secret: $CRON_SECRET" "$URL/api/cron/scout"
          else
            curl --fail-with-body -sS --max-time 70 -w " (HTTP %{http_code})\n" "$URL/api/cron/scout"
          fi
